name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        shell: pwsh
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath rust-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = ((Get-Content rust-test.log -Tail 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::Rust test diagnostics (last 60 lines):%0A$tail"
          }
          exit $code

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
